<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post | AgroWise</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/farmer_connect.css') }}">
</head>

<body>

    <header class="navbar">
        <div class="logo"><span>🌱</span> AgroWise</div>
        <div class="nav-right">
            <a href="{{ url_for('farmer_connect') }}" class="back-link">← Farmer Connect</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
    </header>


    <main class="forum-container">

        <section class="forum-header">
            <div>
                <p class="small-title">FARMER CONNECT</p>
                <h1>✏️ Share a Question or Tip</h1>
            </div>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="flash-message flash-{{ category }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="post-form" method="POST" action="{{ url_for('new_post') }}">

            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Best time to sow wheat in North India?"
                required
            >

            <label for="content">Details</label>
            <textarea
                id="content"
                name="content"
                rows="8"
                placeholder="Describe your question or share your farming tip in detail..."
                required
            ></textarea>

            <button type="submit" class="submit-btn">Post</button>

        </form>

    </main>

</body>

</html>

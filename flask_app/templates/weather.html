<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast | AgroWise</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/weather.css') }}">
</head>

<body>

    <!-- Same navbar style as dashboard, for consistency -->
    <header class="navbar">
        <div class="logo"><span>🌱</span> AgroWise</div>
        <div class="nav-right">
            <a href="{{ url_for('dashboard') }}" class="back-link">← Dashboard</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
    </header>


    <main class="weather-container">

        <section class="weather-header">
            <p class="small-title">WEATHER FORECAST</p>
            <h1>🌦️ Farm Weather Outlook</h1>
            <p>Check current conditions and the 7-day forecast for your farm's location.</p>
        </section>

        <!-- Search box: farmer can type any city/village name -->
        <section class="weather-search">
            <input
                type="text"
                id="location-input"
                placeholder="Enter city, district or village"
                value="{{ default_location }}"
            >
            <button id="search-btn">Search</button>
        </section>

        <!-- Error / loading messages, hidden by default, shown via JS -->
        <p id="weather-error" class="weather-error hidden"></p>
        <p id="weather-loading" class="weather-loading hidden">Fetching weather data...</p>

        <!-- Current weather card: filled in by JS after API call -->
        <section id="current-weather-card" class="current-weather-card hidden">

            <div class="current-weather-main">
                <div class="current-icon" id="current-icon">☀️</div>
                <div>
                    <h2 id="current-location">--</h2>
                    <p id="current-description">--</p>
                </div>
            </div>

            <div class="current-weather-stats">
                <div class="stat">
                    <span class="stat-label">Temperature</span>
                    <span class="stat-value" id="current-temp">-- °C</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Humidity</span>
                    <span class="stat-value" id="current-humidity">-- %</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Rainfall</span>
                    <span class="stat-value" id="current-rain">-- mm</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Wind Speed</span>
                    <span class="stat-value" id="current-wind">-- km/h</span>
                </div>
            </div>

        </section>

        <!-- Simple rule-based farming tips, generated by weather_service.py -->
        <section id="advisory-section" class="advisory-section hidden">
            <h3>🧑‍🌾 Farming Advisory</h3>
            <ul id="advisory-list"></ul>
        </section>

        <!-- 7-day forecast cards -->
        <section id="forecast-section" class="forecast-section hidden">
            <h3>7-Day Forecast</h3>
            <div class="forecast-grid" id="forecast-grid"></div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='js/weather.js') }}"></script>

</body>

</html>
